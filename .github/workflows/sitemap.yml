name: Generate sitemap.xml

on:
  push:
    branches:
      - main          # ветка, из которой собирается сайт

jobs:
  sitemap_job:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий с полной историей (нужно для lastmod)
      - name: Checkout the repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # важно: без этого lastmod будет некорректным

      # 2. Генерируем sitemap.xml
      - name: Generate the sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://allexallex.github.io/thefirsttool/
          include-extensions: html,htm,md
          exclude-patterns: _site/,node_modules/,tests/,.*\.draft\.html
          # lastmod-source: git      # по умолчанию уже берёт из git, можно явно указать

      # 3. Коммитим и пушим обновлённый sitemap.xml, если он изменился
      - name: Commit and push sitemap.xml
        run: |
          if git status --porcelain sitemap.xml | grep -q '^ M'; then
            git config --global user.name 'github-actions'
            git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sitemap.xml
            git commit -m "Update sitemap.xml"
            git push
          else
            echo "sitemap.xml not changed"
          fi
